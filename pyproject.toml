[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mkg-sure"
version = "0.2.0"
description = "Staged reader-aligned graph path selection and evidence sufficiency for VideoQA"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.1"]

[project.optional-dependencies]
real = [
  "transformers>=4.57.0",
  "accelerate>=1.0",
  "safetensors>=0.4",
  "pillow>=10",
  "opencv-python>=4.9",
]
test = ["pytest>=8"]

[project.scripts]
mkg-sure = "mkg_sure.pipeline:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
